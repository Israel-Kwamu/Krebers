<!-- Single Page Header start -->
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Authentication</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a routerLink="/home" class="text-white-50">Home</a></li>
        <li class="breadcrumb-item active text-white">My Account / Auth</li>
    </ol>
</div>
<!-- Single Page Header End -->

<!-- Auth Section Start -->
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header border-0 bg-primary text-white p-4 text-center">
                    <div class="bg-white rounded-3 px-3 py-2 shadow-sm mb-2 d-inline-flex align-items-center justify-content-center">
                        <img src="./assets/img/krebers.jpg" alt="Krebers Logo" class="img-fluid" style="max-height: 52px; object-fit: contain;">
                    </div>
                    <p class="mb-0 text-white-50">Sign in to sync your cart, wishlist & order history</p>
                </div>

                <div class="card-body p-4 bg-white">
                    <!-- Google 1-Click OAuth Button -->
                    <button type="button" 
                            class="btn btn-outline-dark w-100 rounded-pill py-2.5 px-3 fw-semibold d-flex align-items-center justify-content-center gap-2 mb-3 shadow-sm"
                            [disabled]="isAuthLoading"
                            (click)="googleSignIn()"
                            style="border: 1px solid #ced4da; transition: all 0.2s ease;">
                        <svg width="18" height="18" viewBox="0 0 18 18" class="me-1">
                          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
                          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
                          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>

                    <div class="d-flex align-items-center my-3 text-muted">
                        <hr class="flex-grow-1 my-0">
                        <span class="px-3 small text-uppercase text-muted fw-bold" style="font-size: 0.75rem; letter-spacing: 0.5px;">or use email</span>
                        <hr class="flex-grow-1 my-0">
                    </div>

                    <!-- Tabs: Login / Register -->
                    <div class="auth-tabs-wrapper p-1 rounded-pill mb-4 bg-light" style="border: 1px solid #e9ecef;">
                        <div class="row g-1">
                            <div class="col-6">
                                <button type="button" 
                                        class="btn w-100 rounded-pill py-2 small fw-bold text-center" 
                                        [ngClass]="authTab === 'login' ? 'btn-primary text-white shadow-sm' : 'btn-light text-muted'"
                                        (click)="authTab = 'login'; authErrorMessage = ''"
                                        style="font-size: 14px; transition: all 0.2s ease;">
                                    Sign In
                                </button>
                            </div>
                            <div class="col-6">
                                <button type="button" 
                                        class="btn w-100 rounded-pill py-2 small fw-bold text-center" 
                                        [ngClass]="authTab === 'register' ? 'btn-primary text-white shadow-sm' : 'btn-light text-muted'"
                                        (click)="authTab = 'register'; authErrorMessage = ''"
                                        style="font-size: 14px; transition: all 0.2s ease;">
                                    Create Account
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Error Alert -->
                    <div class="alert alert-danger py-2 small mb-3 rounded-3 d-flex align-items-center gap-2" *ngIf="authErrorMessage">
                        <i class="fas fa-exclamation-circle text-danger"></i>
                        <span>{{ authErrorMessage }}</span>
                    </div>

                    <!-- Email/Password Form -->
                    <form (ngSubmit)="submitEmailAuth()">
                        <div class="mb-3" *ngIf="authTab === 'register'">
                            <label class="form-label small fw-bold text-muted mb-1">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted" style="border: 1px solid #ced4da;"><i class="fas fa-user small"></i></span>
                                <input type="text" class="form-control border-start-0 rounded-end-3 py-2 fs-6" [(ngModel)]="nameInput" name="nameInput" placeholder="Jane Doe" style="border: 1px solid #ced4da;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted mb-1">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted" style="border: 1px solid #ced4da;"><i class="fas fa-envelope small"></i></span>
                                <input type="email" class="form-control border-start-0 rounded-end-3 py-2 fs-6" [(ngModel)]="emailInput" name="emailInput" placeholder="name@example.com" required style="border: 1px solid #ced4da;">
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label small fw-bold text-muted mb-0">Password</label>
                                <button type="button" class="btn btn-link p-0 small text-decoration-none text-primary" *ngIf="authTab === 'login'" (click)="forgotPassword()">Forgot?</button>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 rounded-start-3 text-muted" style="border: 1px solid #ced4da;"><i class="fas fa-lock small"></i></span>
                                <input type="password" class="form-control border-start-0 rounded-end-3 py-2 fs-6" [(ngModel)]="passwordInput" name="passwordInput" placeholder="••••••••" required style="border: 1px solid #ced4da;">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2.5 fw-bold shadow-sm" [disabled]="isAuthLoading" style="transition: all 0.2s ease;">
                            <span class="spinner-border spinner-border-sm me-2" *ngIf="isAuthLoading"></span>
                            <span>{{ authTab === 'login' ? 'Sign In' : 'Register' }}</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Auth Section End -->
