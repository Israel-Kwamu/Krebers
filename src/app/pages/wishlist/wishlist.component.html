<!-- Single Page Header start -->
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6 wow fadeInUp" data-wow-delay="0.1s">Wishlist Page</h1>
    <ol class="breadcrumb justify-content-center mb-0 wow fadeInUp" data-wow-delay="0.3s">
        <li class="breadcrumb-item"><a href="/home">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Pages</a></li>
        <li class="breadcrumb-item active text-white">Wishlist Page</li>
    </ol>
</div>
<!-- Single Page Header End -->

<!-- Wishlist Page Start -->
<div class="container py-5" *ngIf="wishlistItems.length > 0; else emptyWishlist">
  <div class="table-responsive">
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Category</th>
          <th>Stock Status</th>
          <th>Add to Cart</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of wishlistItems">
          <td>
            <div class="d-flex align-items-center">
              <img [src]="item.images[0]" class="img-fluid me-3 rounded" style="width: 80px; height: 80px; object-fit: cover;" [alt]="item.name" referrerpolicy="no-referrer">
              <a [routerLink]="['/product', item.id]" class="text-dark fw-bold text-decoration-none hover-text-primary">{{ item.name }}</a>
            </div>
          </td>
          <td>{{ item.currentPrice | fxCurrency }}</td>
          <td>{{ item.category }}</td>
          <td>
            <span class="badge rounded-pill px-3 py-2" [class.bg-success]="item.qty !== 0" [class.bg-danger]="item.qty === 0">
              {{ item.qty !== 0 ? 'In Stock' : 'Out of Stock' }}
            </span>
          </td>
          <td>
            <button class="btn btn-primary" [disabled]="item.qty === 0" (click)="addToCart(item)">
              <i class="fas fa-shopping-cart me-1"></i> Add To Cart
            </button>
          </td>
          <td>
            <button class="btn btn-sm btn-danger" (click)="removeFromWishlist(item.id)">
              <i class="fas fa-times"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="mt-4 text-end">
    <button class="btn btn-outline-danger" (click)="clearWishlist()">
      <i class="fas fa-trash-alt me-1"></i> Clear Wishlist
    </button>
  </div>
</div>

<ng-template #emptyWishlist>
  <div class="text-center py-5">
    <h4>Your wishlist is empty.</h4>
    <a routerLink="/shop" class="btn btn-primary mt-3">Go to Shop</a>
  </div>
</ng-template>
<!-- Wishlist Page End -->
