<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Krebers</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/jpeg" href="assets/img/krebersfavicon.jpg">


  <!-- Google Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Icon Font Stylesheet -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Libraries Stylesheet -->
  <link href="./assets/lib/animate/animate.min.css" rel="stylesheet">
  <link href="./assets/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">


  <!-- Customized Bootstrap Stylesheet -->
  <link href="./assets/css/bootstrap.min.css" rel="stylesheet">

  <!-- Template Stylesheet -->
  <link href="./assets/css/style.css" rel="stylesheet">
</head>

<body>
  <app-root>
    <!-- Initial Premium Preloader -->
    <div id="initial-preloader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999999; font-family: 'Open Sans', 'Roboto', sans-serif;">
      <div style="margin-bottom: 24px; text-align: center;">
        <img src="./assets/img/krebers.jpg" alt="Krebers Logo" style="max-height: 75px; object-fit: contain; animation: pulse 2s infinite ease-in-out;">
      </div>
      <div style="width: 44px; height: 44px; border: 3px solid #e2e8f0; border-top: 3px solid #81c408; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
      <h5 style="color: #1e293b; font-weight: 700; font-size: 16px; margin: 0; letter-spacing: 0.5px; text-transform: uppercase;">Krebers Store</h5>
      <span style="color: #64748b; font-size: 12px; margin-top: 6px;">Loading Premium Native Apparel...</span>
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.6; transform: scale(0.97); }
          50% { opacity: 1; transform: scale(1.03); }
        }
      </style>
    </div>
  </app-root>









  <!-- Back to Top -->
  <a href="#" class="btn btn-primary btn-lg-square back-to-top"><i class="fa fa-arrow-up"></i></a>


  <!-- JavaScript Libraries -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./assets/lib/wow/wow.min.js"></script>
  <script src="./assets/lib/owlcarousel/owl.carousel.min.js"></script>


  <!-- Template Javascript -->
  <script src="./assets/js/main.js"></script>

<script>
  if (typeof jQuery !== 'undefined') {
    jQuery(document).ready(function($){
      if ($.fn && $.fn.owlCarousel && $(".productList-carousel").length) {
        $(".productList-carousel").owlCarousel({
            items: 1,               // 1 slide per view (you can adjust)
            loop: true,
            margin: 10,
            nav: true,              // Show prev/next buttons
            navText: [
                '<i class="fas fa-chevron-left"></i>',
                '<i class="fas fa-chevron-right"></i>'
            ],
            dots: false,
            autoplay: false,
            responsive: {
                768: {
                    items: 2
                },
                992: {
                    items: 3
                }
            }
        });
      }
    });
  }
</script>

</body>

</html>
